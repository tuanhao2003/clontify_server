syntax = "proto3";

package app.grpc.protos;

service UserService {
    rpc GetProfileByID(GetProfileByIDRequest) returns (ProfileResponse) {}
    rpc CreateProfile(CreateProfileRequest) returns (ProfileResponse) {}
    rpc UpdateProfile(UpdateProfileRequest) returns (ProfileResponse) {}
    rpc DeleteProfile(DeleteProfileRequest) returns (ProfileResponse) {}
    rpc GetProfileByAccountID(GetProfileByAccountIDRequest) returns (ProfileResponse) {}
} 

message ProfileResponse {
    string id = 1;
    string accountID = 2;
    string fullName = 3;
    string avatarUrl = 4;
    string bio = 5;
    string dateOfBirth = 6;
    string phoneNumber = 7;
    string createdAt = 8;
    string updatedAt = 9;
    string deletedAt = 10;
    bool isActive = 11;
}

message GetProfileByIDRequest {
    string id = 1;
}

message CreateProfileRequest {
    string accountID = 1;
    string fullName = 2;
    string avatarUrl = 3;
    string bio = 4;
    string dateOfBirth = 5;
    string phoneNumber = 6;
}

message UpdateProfileRequest {
    string id = 1;
    string fullName = 2;
    string avatarUrl = 3;
    string bio = 4;
    string dateOfBirth = 5;
    string phoneNumber = 6;
}

message DeleteProfileRequest {
    string id = 1;
}


message GetProfileByAccountIDRequest {
    string accountID = 1;
}