syntax = "proto3";

package storage;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

service StorageService {
  rpc UploadFile(UploadFileRequest) returns (FileResponse) {}
  rpc DeleteFile(DeleteFileRequest) returns (google.protobuf.Empty) {}
  rpc GetFile(GetFileRequest) returns (FileResponse) {}
  rpc GetPresignedUrl(GetPresignedUrlRequest) returns (PresignedUrlResponse) {}
}

message UploadFileRequest {
  bytes file_data = 1;
  string file_name = 2;
  string file_type = 3;  // audio, image, video
  string content_type = 4;
}

message DeleteFileRequest {
  string file_id = 1;
}

message GetFileRequest {
  string file_id = 1;
}

message GetPresignedUrlRequest {
  string file_id = 1;
  int32 expiration = 2;  // in seconds
}

message FileResponse {
  string id = 1;
  string file_name = 2;
  string file_type = 3;
  int64 file_size = 4;
  string s3_url = 5;
  string created_at = 6;
  string updated_at = 7;
}

message PresignedUrlResponse {
  string url = 1;
  int32 expiration = 2;
} 